[package]
name = "rustyalias"
version = "1.8.1"
edition = "2021"
readme = "README.md"
rust-version = "1.96.0"
homepage = "https://stenstromen.se"
repository = "https://github.com/stenstromen/rustyalias"
description = "Wildcard DNS for any IP Address"

[dependencies]
log = "0.4"
env_logger = "0.11"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
